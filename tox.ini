[tox]
envlist = flake8, pydocstyle, py310, py311, py312, py313


[gh-actions]
python =
  3.10: py310, flake8, pydocstyle
  3.11: py311
  3.12: py312
  3.13: py313


[testenv:py27]
commands = 
    python -m pytest --doctest-modules scholia
    python -m pytest tests
deps=
    pytest
    -rrequirements.txt

[testenv:py35]
commands = 
    python -m pytest --doctest-modules scholia
    python -m pytest tests
deps=
    pytest
    -rrequirements.txt

[testenv:py37]
commands = 
    python -m pytest --doctest-modules scholia
    python -m pytest tests
deps=
    pytest
    -rrequirements.txt

[testenv:py38]
commands = 
    python -m pytest --doctest-modules scholia
    python -m pytest tests
deps=
    pytest
    -rrequirements.txt

[testenv:py39]
commands = 
    python -m pytest --doctest-modules scholia
    python -m pytest tests
deps=
    pytest
    -rrequirements.txt

[testenv:py310]
commands =
    python -m pytest --doctest-modules --reruns 2 --reruns-delay 30 scholia
    python -m pytest --reruns 2 --reruns-delay 30 tests
deps=
    pytest
    pytest-rerunfailures
    -rrequirements.txt

[testenv:py311]
commands =
    python -m pytest --doctest-modules --reruns 2 --reruns-delay 30 scholia
    python -m pytest --reruns 2 --reruns-delay 30 tests
deps=
    pytest
    pytest-rerunfailures
    -rrequirements.txt

[testenv:py312]
commands =
    python -m pytest --doctest-modules --reruns 2 --reruns-delay 30 scholia
    python -m pytest --reruns 2 --reruns-delay 30 tests
deps=
    pytest
    pytest-rerunfailures
    -rrequirements.txt

[testenv:py313]
commands =
    python -m pytest --doctest-modules --reruns 2 --reruns-delay 30 scholia
    python -m pytest --reruns 2 --reruns-delay 30 tests
deps=
    pytest
    pytest-rerunfailures
    -rrequirements.txt


[testenv:flake8]
commands = flake8 scholia
deps = 
    flake8
    flake8-docstrings

[testenv:pydocstyle]
commands = pydocstyle --convention=numpy scholia
deps = 
    pydocstyle

[testenv:docs]
description = Build Sphinx documentation
deps =
    -rrequirements.txt
    -rdocs/requirements.txt
commands =
    sphinx-build -b html docs docs/_build/html
