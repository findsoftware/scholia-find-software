[tox]
envlist = flake8, pydocstyle, py310, py311, py312, py313


[gh-actions]
python =
  3.10: py310
  3.11: py311
  3.12: py312
  3.13: py313


[testenv]
commands =
    python -m pytest --doctest-modules --reruns 2 --reruns-delay 30 scholia
    python -m pytest --reruns 2 --reruns-delay 30 tests
deps=
    pytest
    pytest-rerunfailures
    -rrequirements.txt

[testenv:py311]
commands =
    python -m pytest --doctest-modules --reruns 2 --reruns-delay 30 scholia
    python -m pytest --reruns 2 --reruns-delay 30 tests
deps=
    pytest
    pytest-rerunfailures
    -rrequirements.txt

[testenv:py312]
commands =
    python -m pytest --doctest-modules --reruns 2 --reruns-delay 30 scholia
    python -m pytest --reruns 2 --reruns-delay 30 tests
deps=
    pytest
    pytest-rerunfailures
    -rrequirements.txt

[testenv:py313]
commands =
    python -m pytest --doctest-modules --reruns 2 --reruns-delay 30 scholia
    python -m pytest --reruns 2 --reruns-delay 30 tests
deps=
    pytest
    pytest-rerunfailures
    -rrequirements.txt


[testenv:flake8]
skip_install = true
commands = flake8 scholia
deps =
    flake8
    flake8-docstrings

[testenv:pydocstyle]
skip_install = true
commands = pydocstyle --convention=numpy scholia
deps =
    pydocstyle

[testenv:docs]
description = Build Sphinx documentation
deps =
    -rrequirements.txt
    -rdocs/requirements.txt
commands =
    sphinx-build -b html docs docs/_build/html
